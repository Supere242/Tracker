 const c=h=>done.filter(a=>g(a.id).how===h).length,ff=all.reduce((t,a)=>t+g(a.id).ff,0),fin=c("final"),rec=all.reduce((t,a)=>t+g(a.id).rec,0);

 const fails=all.flatMap(a=>g(a.id).log.filter(l=>/fail|recur/.test(l.k)).map(()=>0));
 const enP=all.filter(a=>!ok(g(a.id))&&g(a.id).pend).length,bl=all.filter(a=>!g(a.id).how&&cur(a.id).length).length;
 const rate=done.length?Math.round((c("promo"))/done.length*100):0;
 return {done,tot,pct,c,ff,fin,rec,notas,fails,enP,bl,rate}}
function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===V));
 const t=stats();
 let h=`<div class="card hero"><div style="display:flex;justify-content:space-between;align-items:end"><div><div class="big">${t.pct}%</div><div>${t.done.length} de ${t.tot} materias</div></div><div style="text-align:right"><div class="big" style="font-size:34px">${avg([...t.notas,...t.fails])}</div><div>promedio</div></div></div><div class="bar"><i style="width:${t.pct}%"></i></div>
 <div style="font-size:13px;margin-top:10px">${t.pct>=100?"🎓 ¡Ingeniera/o en Biotecnología!":t.pct>=50?"✨ ¡Pasaste la mitad!":"🌱 Cada materia suma"}</div></div>`;
 if(V==="m"){
  h+=`<div class="card"><h2>📊 Tus estadísticas</h2><div class="grid">
  <div class="st"><b>${t.c("promo")}</b><span>Promocionadas (70%+)</span></div><div class="st"><b>${t.c("seg")}</b><span>Aprobadas en 2ª instancia</span></div>
  <div class="st"><b>${t.fin}</b><span>Aprobadas por final</span></div><div class="st"><b>${t.enP}</b><span>En 2ª instancia / final</span></div>
  <div class="st"><b>${t.ff}</b><span>Finales desaprobados</span></div><div class="st"><b>${t.rec}</b><span>Recursadas</span></div></div>
  <div class="info">Promoción directa: <b>${t.rate}%</b> · Con previa pendiente: <b>${t.bl}</b></div></div>`;
  let i=0;
  PLAN.forEach((y,yi)=>{const ya=all.filter(a=>a.yi===yi),yd=ya.filter(a=>ok(g(a.id))).length;
   h+=`<div class="yr"><h2>${y[0]}</h2><span class="pill">${yd}/${ya.length}</span></div>`;
   y[1].forEach(cu=>{h+=`<div class="cu">${cu[0]}</div>`;
    cu[1].forEach(()=>{const a=all[i++],s=g(a.id),tg=tag(a.id),lk=0;
     h+=`<button class="subj ${ok(s)?"ok":""} ${lk?"lock":""}" data-id="${a.id}"><span class="dot">${ok(s)?"✓":lk?"🔒":"·"}</span><span class="n">${a.n}<small>${s.mode==="seg"?"Instancia: 2ª instancia":s.mode==="final"?"Instancia: examen final":"Tocá para elegir 2ª instancia o final"}</small></span><span class="tag ${tg[0]}">${tg[1]}</span></button>`})})});
 }else{
  const nf=a=>g(a.id).log.filter(l=>/fail|recur/.test(l.k)),rep=all.reduce((x,a)=>x+nf(a).length,0);
  h+=`<div class="card"><h2>🎓 Certificado de escolaridad</h2><div class="grid"><div class="st"><b>${avg([...t.notas,...t.fails])}</b><span>Promedio de calificaciones</span></div><div class="st"><b>${avg(t.notas)}</b><span>Promedio de materias aprobadas</span></div><div class="st"><b>${t.done.length} / ${t.tot}</b><span>Materias obtenidas / requeridas</span></div><div class="st"><b>${rep}</b><span>Reprobaciones</span></div></div><div class="info">Promedio = suma de notas de aprobación ÷ (aprobadas + reprobaciones). Cada reprobación vale 0%.</div></div>`;
  let i=0;PLAN.forEach(y=>y[1].forEach(cu=>{h+=`<div class="cu">${cu[0]}</div>`;cu[1].forEach(()=>{const a=all[i++],s=g(a.id),f=nf(a),ld=f.map(l=>l.d).filter(Boolean).sort().pop();
   h+=`<div class="er"><div class="m"><b>${ok(s)?"✓ ":""}${a.n}</b><span>${s.how?`${fmt(s.date)} · Aprobada ${s.nota??""}%${ok(s)?"":" (espera previa)"}`:"Sin aprobar"}</span></div><div style="text-align:right;font-size:12px;color:var(--mu)">${f.length?`${f.length} no aprob.<br>${fmt(ld)}`:""}</div></div>`})}))}
 $("stats").innerHTML=h;$("list").innerHTML=""; }
const MSG=["¡Felicitaciones! 🎉","¡Bien ahí, crack! 🌸","¡Lo lograste! 💜 Orgullo total","¡Aprobada! ✨ Seguí así","¡Qué grande! 🥳 Un paso más cerca del título"];
function confetti(){const cols=["#f5a9c6","#b9a6f2","#a8e3c8","#ffd0b5","#a9d6f5","#ffe58f"];for(let k=0;k<50;k++){const e=document.createElement("i");e.className="cf";e.style.left=Math.random()*100+"vw";e.style.background=cols[k%6];e.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3200)}
function sheet(id){
 delete $("sheet").dataset.bulk;$("sheet").dataset.id=id;const s=g(id),a=all[id],tg=tag(id),m=miss(id);
 if(SV==="prev"){let h=`<h2 style="font-size:20px">Previas de ${a.n}</h2><div class="info">Elegí las materias que tenés que tener aprobadas antes.</div>`;
  PLAN.forEach((y,yi)=>{const xs=all.filter(x=>x.yi===yi&&x.id!==id);h+=`<div class="cu">${y[0]}</div><div class="chips">${xs.map(x=>`<button class="chip ${s.prev.includes(x.id)?"on":""}" data-p="${x.id}">${x.n}</button>`).join("")}</div>`});
  $("sheet").innerHTML=h+`<div class="cu">Para inscribirme, cada previa tiene que estar:</div><div class="seg2"><button class="${s.req==="parcial"?"":"on"}" data-a="r-total">💯 Aprobada (total)</button><button class="${s.req==="parcial"?"on":""}" data-a="r-parcial">📝 Parcial (ir a examen)</button></div><button class="btn b1" data-a="back">Listo ✓</button>`;return}
 let h=`<h2 style="font-size:20px">${a.n}</h2><div style="margin-top:6px"><span class="tag ${tg[0]}">${tg[1]}</span></div>`;
 h+=reqHtml("Para inscribirme",s.ins)+reqHtml("Para aprobar",s.apr);
 h+=`<div class="cu" style="margin-top:14px">Si no llego al 70%, esta materia se resuelve con:</div><div class="seg2"><button class="${s.mode==="seg"?"on":""}" data-a="m-seg">🔄 2ª instancia de parcial</button><button class="${s.mode==="final"?"on":""}" data-a="m-final">📝 Examen final</button></div>`;
 const inputs=`<div class="row2"><label>Nota (%)<input id="nota" type="number" inputmode="decimal" min="0" max="100" step="0.1" placeholder="ej. 85" value="${s.nota??""}"></label><label>Fecha<input id="fecha" type="date" value="${s.date||today()}"></label></div>`;
 if(s.how){h+=(m.length?`<div class="warn">⏳ Queda en espera: se confirma cuando apruebes ${m.join(", ")}.</div>`:"")+inputs+`<button class="btn b1" data-a="savenota">💾 Guardar nota y fecha</button>`}
 
 else if(!s.mode){h+=`<div class="info">Elegí arriba cómo se resuelve esta materia para ver las opciones 👆</div>`}
 else{h+=([...new Set([...cur(id),...m])].length?`<div class="warn">⚠️ Todavía no cumplís las previas (te falta: ${[...new Set([...cur(id),...m])].join(", ")}). Podés registrarla igual, pero queda en espera hasta que las apruebes.</div>`:"")+inputs+`<div class="info">La nota solo se pone al aprobar. Si desaprobás un examen o recursás, cuenta como 0 en el promedio.</div><button class="btn b1" data-a="promo">🌟 Aprobé con 70% o más</button>`;
  if(!s.pend)h+=`<button class="btn b3" data-a="pend">${s.mode==="seg"?"🔄 No llegué al 70% → voy a 2ª instancia":"📝 No llegué al 70% → rindo examen final"}</button>`;
  else if(s.mode==="seg")h+=`<button class="btn b2" data-a="segok">✅ Aprobé la 2ª instancia</button><button class="btn b4" data-a="segfail">😮‍💨 No aprobé la 2ª instancia → recursar</button>`;
  else h+=`<div class="info">Finales desaprobados: <b>${s.ff}</b></div><button class="btn b2" data-a="finok">🎉 Aprobé el final</button><button class="btn b5" data-a="finfail">😕 Desaprobé el final (siguiente intento)</button><button class="btn b4" data-a="recur">🔁 Voy a recursar</button>`}
 if(s.rec)h+=`<div class="info">Veces recursada: <b>${s.rec}</b></div>`;
 $("sheet").innerHTML=h+`<button class="btn b6" data-a="reset">↺ Reiniciar esta materia</button><button class="btn b6" data-a="close">Cerrar</button>`;$("ov").classList.add("on")}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(b){V=b.dataset.v;render()}};
$("stats").onclick=e=>{if(e.target.closest("[data-a=bulk]")){bulkSheet();return}const b=e.target.closest(".subj");if(b){SV="main";sheet(+b.dataset.id)}};
$("ov").onclick=e=>{if(e.target.id==="ov"){$("ov").classList.remove("on");return}
 if($("sheet").dataset.bulk){const x=e.target.closest("[data-a]");if(x&&x.dataset.a==="bulkgo")bulkApply();else if(x&&x.dataset.a==="close")$("ov").classList.remove("on");return}
 const id=+$("sheet").dataset.id,s=g(id);
 const ch=e.target.closest("[data-p]");if(ch){const p=+ch.dataset.p,i=s.prev.indexOf(p);i>=0?s.prev.splice(i,1):s.prev.push(p);rebuild(s);save();sheet(id);render();return}
 const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;
 const nv=$("nota")?$("nota").value:"",nota=nv===""?null:Math.min(100,Math.max(0,+nv)),d=$("fecha")?$("fecha").value||today():today();
 const before=all.filter(x=>!ok(g(x.id))&&!cur(x.id).length).map(x=>x.id),okB=all.filter(x=>ok(g(x.id))).map(x=>x.id);
 const log=(k,n)=>s.log.push({k,d,n});
 if(a==="close"){$("ov").classList.remove("on");return}
 if(a==="prev"){SV="prev";sheet(id);return}
 if(a==="back"){SV="main";sheet(id);return}
 if(a==="r-total"||a==="r-parcial"){s.req=a.slice(2);rebuild(s);save();sheet(id);render();return}
 if(a==="m-seg"||a==="m-final"){s.mode=a.slice(2);save();sheet(id);render();return}
 if(["promo","segok","finok"].includes(a)){if(nota==null){toast("Poné la nota primero 💜");return}
  s.how=a==="promo"?"promo":a==="segok"?"seg":"final";s.nota=nota;s.date=d;s.pend=false;log(a,nota)}
 else if(a==="savenota"){s.nota=nota;s.date=d;const l=s.log.slice().reverse().find(x=>/ok$|promo/.test(x.k));if(l){l.n=nota;l.d=d}}
 else if(a==="pend"){s.pend=true}
 else if(a==="finfail"){s.ff++;log("finfail",0)}
 else if(a==="segfail"){s.rec++;s.pend=false;s.ff=0;log("segfail",0)}
 else if(a==="recur"){s.rec++;s.pend=false;s.ff=0;log("recur",0)}
 else if(a==="reset"){Object.assign(s,{how:null,nota:null,date:null,pend:false,ff:0,rec:0,log:[]})}
 save();render();
 if(["promo","segok","finok"].includes(a)){$("ov").classList.remove("on");
  const left=all.filter(x=>!ok(g(x.id))).length,nu=all.filter(x=>!ok(g(x.id))&&!g(x.id).how&&!cur(x.id).length&&!before.includes(x.id)).map(x=>x.n),cf=all.filter(x=>x.id!==id&&ok(g(x.id))&&!okB.includes(x.id)).map(x=>x.n);
  if(!ok(s))toast("⏳ Registrado. Queda en espera hasta que apruebes: "+miss(id).slice(0,3).join(", "));
  else{confetti();toast(left===0?"🎓 ¡¡TERMINASTE LA CARRERA!! ¡Ingeniera/o en Biotecnología!":`${MSG[Math.floor(Math.random()*MSG.length)]} Sacaste ${nota}%. Faltan ${left}.`+(cf.length?` ✅ Se confirmó: ${cf.slice(0,3).join(", ")}.`:"")+(nu.length?` 🔓 Se habilitó: ${nu.slice(0,3).join(", ")}${nu.length>3?"…":""}`:""))}}
 else if(a==="finfail"){sheet(id);toast("💪 Ya casi, el próximo es el bueno")}
 else if(a==="segfail"||a==="recur"){$("ov").classList.remove("on");toast("🌈 Nueva oportunidad, vas a rendir mejor")}
 else if(a==="savenota"){toast("💾 Guardado");sheet(id)}
 else sheet(id)};
function bulkSheet(){const sh=$("sheet");sh.dataset.bulk="1";
const cur=all.filter(a=>g(a.id).prev.length&&!g(a.id).ort).map(a=>a.n+": "+g(a.id).prev.map(p=>all[p].n).join(", ")).join("\n");
sh.innerHTML=`<h2 style="font-size:20px">📋 Previas en bloque</h2><div class="info">Una materia por línea: <b>Materia: previa 1, previa 2</b><br>Ej: Matemática 2: Matemática 1<br>Podés ir sumando de a poco; reemplaza solo las materias que escribas.</div><textarea id="bulk" placeholder="Matemática 2: Matemática 1" style="width:100%;height:240px;margin-top:10px;border:2px solid var(--lav);background:var(--card);color:var(--tx);font:inherit;font-size:15px;padding:12px;border-radius:20px">${cur}</textarea><button class="btn b1" data-a="bulkgo">Guardar previas ✓</button><button class="btn b6" data-a="close">Cerrar</button>`;$("ov").classList.add("on")}
const nz=x=>x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
function bulkApply(){const bad=[];$("bulk").value.split("\n").forEach(l=>{const i=l.indexOf(":");if(i<0)return;const f=nz(l.slice(0,i)),t=all.filter(a=>nz(a.n)===f);if(!t.length){if(f)bad.push(l.slice(0,i).trim());return}
const ps=[];l.slice(i+1).split(/[,;]/).forEach(p=>{const q=nz(p);if(!q)return;const m=all.find(a=>nz(a.n)===q)||all.find(a=>nz(a.n).startsWith(q));if(m&&m.id!==t[0].id)ps.push(m.id);else bad.push(p.trim())});
{const q=g(t[0].id);q.prev=[...new Set(ps)];rebuild(q)}});save();render();$("ov").classList.remove("on");toast(bad.length?"Guardado. No encontré: "+bad.slice(0,3).join(", "):"💜 Previas guardadas")}
render();
</script></body></html>
